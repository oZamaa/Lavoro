services:
  app:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache python3 make g++ && npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_PATH=/app/data/jobtrack.db
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
volumes:
  node_modules:
